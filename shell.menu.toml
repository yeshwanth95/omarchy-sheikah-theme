# Sheikah Slate menu. The selected row is the Slate's active frame: it drops to
# the near-black of the tapestry ground, takes the charged edge the focused
# window wears, and carries a halo of the same light.
#
# A theme override replaces its whole section rather than merging into it
# (omarchy-theme-set-templates: apply_shell_section_override drops the
# generated lines), so every [menu] key has to be restated here, not just the
# ones that change.
[menu]
background                = "#00152d"
background-alpha          = 1.0
text                      = "#afc1d5"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#00152d"
scrim-alpha               = 0.5

# The row the cursor is on. Stock Omarchy lifts it a little off the card with a
# translucent wash of the foreground; the Slate does the opposite and sinks it
# to the ground colour, so the bright edge around it is the thing that reads.
selected-background       = "#00060c"
selected-background-alpha = 0.9
selected-text             = "#e9f1fc"

# The bright end of the focused window's border, at full strength. Stock holds
# this at 0.25, which is why the stock row has no visible outline.
selected-border           = "#bddcff"
selected-border-alpha     = 1.0
selected-border-width     = 1

# --- read by the menu plugin, not by Omarchy -------------------------------
# Omarchy has no tokens for these; Color.parseShell keeps any key it does not
# recognise, so they ride along in Color.shellValues and the patched Menu.qml
# picks them up. A theme that omits them gets the stock flat row, which is what
# every other theme does.

# Leg length in px of the corner brackets. 0 or absent turns them off.
selected-corners          = 8

# Rows the cursor is not on. Omarchy leaves these with no outline at all; the
# Slate gives them a dim one so the list reads as a stack of slots rather than
# floating text. Border.surfaceSpec resolves any token name, so this needs no
# parsing on the QML side -- absent means no idle outline.
row-border                = "#15508f"
row-border-alpha          = 0.55
row-border-width          = 1

# The halo. Hyprland's window halo runs the same accent a rung hotter than the
# border and lets it fall off into the dark; this is that, in two dimensions.
selected-glow             = "#258af5"
selected-glow-alpha       = 0.70
selected-glow-blur        = 14

# The card grows from its own centre when the menu opens and shrinks back to it
# when it closes. Hyprland is told not to animate this surface at all
# (hypr/apps/omarchy-shell.lua puts omarchy-menu in a no_anim layer rule,
# because panels are expected to carry their own QML transition), so without
# these the menu appears and disappears on a single frame.
#
# 140ms / OutCubic is the shell's own house timing -- the same literal sits in
# PopupCard.qml, KeyboardPanel.qml, PanelSlider.qml and WidgetButton.qml -- so
# the menu moves like every other Quickshell surface. 0.87 is Hyprland's own
# grow distance for a window opening ("popin 87%" in looknfeel.lua), which puts
# the menu and the windows under it on the same footing.
open-duration             = 140
# Scale the card starts from and returns to. 1.0 means fade with no scale.
open-scale                = 0.87

# --- patching the menu plugin ------------------------------------------------
# Everything above this comment block is either a stock Omarchy token (the
# fill and the outline, which need no patch at all) or an extra key read by a
# patched Menu.qml. The patch cannot ship with the theme: the menu belongs to
# whichever plugin owns it, `omarchy bar` has no `remove`, and
# `omarchy plugin disable` on a menu plugin takes the menu down with it -- so
# an installer rewriting shell.json has no business here. Clone the stock menu
# (`omarchy plugin clone omarchy.menu`, which never touches /usr/share) and
# edit the clone's Menu.qml. `assets/menu_item_active.svg` is the design
# reference the numbers above came from.
#
# A shell restart is required afterwards, not just a save: the menu plugin is
# keepLoaded and its widgets are not rebuilt by the usual hot reload, even
# though the log says "Local plugin changed, reloading". Run
# `omarchy restart shell`.
#
# In the row delegate, for the frame:
#
#   - a Loader at z: -1 holding a hidden Rectangle plus a MultiEffect with
#     shadowEnabled and BOTH offsets at zero, so the shadow spreads evenly
#     instead of falling to one side -- the same reasoning as the window halo
#     in hyprland.lua;
#   - a Repeater of four Shape items for the brackets, one path rotated
#     0/90/270/180 about its own centre;
#   - borderSpec on idle rows pointed at row-border instead of Border.none().
#
# Three things there are easy to get wrong, all of them found the hard way:
#
#   - Do NOT use layer.effect for the glow. MultiEffect only honours
#     autoPaddingEnabled when it has its own `source`; as a layer effect it
#     inherits the row's geometry and clips the halo away entirely. Routing the
#     row through a layer also costs the border about 24% of its brightness.
#   - ListView overwrites a delegate's x. Anchor with
#     anchors.horizontalCenter instead, or the row slides to the clip edge and
#     the halo is sheared off left and right.
#   - Widen the list into the card's padding by the glow's reach and give that
#     width back to each row, so the visible row keeps its size. Row HEIGHTS
#     stay untouched, which is what keeps the fold maths honest.
#
# In the PanelWindow, for the open/close animation:
#
#   - a `shown` property for the LOGICAL open (opened && rowsLoaded), and
#     `visible: shown || card.opacity > 0` so the surface outlives the logical
#     close by the length of the shrink -- the PopupCard.qml idiom;
#   - opacity and scale on the card, each with a Behavior gated on whether the
#     theme asked for an animation at all. The card is a Rectangle, so its
#     transformOrigin is Item.Center already and the layer surface is already
#     full-screen, so scaling needs no surface resize;
#   - keyboard focus and the input mask follow `shown`, never `visible`. An
#     exclusive grab held through the shrink locks the keyboard out for its
#     duration, and an app the menu just launched comes up behind a surface
#     that still owns input. KeyboardPanel.qml has this lesson in a comment.
#
# Two subtler ones, both only visible once the card outlives the close:
#
#   - Unfreeze the card's top line on the way IN, not on the way out.
#     Reopening mid-shrink never lowers `visible`, so a reset hung off that is
#     skipped and the new menu inherits the last one's frozen top.
#   - Do not clear the filter text in the close paths. It used to be invisible
#     because the surface vanished on the same frame; now the rows and the
#     prompt line are seen reverting to the unfiltered menu on the way out.
#     Clear it when the surface actually unmaps -- both open paths clear it
#     themselves anyway.
