# Sheikah Slate authentication. The rune border sits cold and etched while idle,
# charges to full glow as the passphrase is entered, and drops to Guardian red
# on a failed reading.
[lock]
background       = "#00060c"
background-alpha = 0.82
text             = "#e9f1fc"
placeholder      = "#597391"
text-error       = "#ff5c48"
border           = "#15508f #258af5 45deg"
border-active    = "#258af5 #7ab8ff 45deg"
border-error     = "#ff5c48"
border-alpha     = 1.0
selection        = "#258af5"
selection-alpha  = 0.45

# --- read by the patched lock plugin, not by Omarchy -------------------------
# The three features below (frame, fade, rune mask) need a patched lock screen,
# which `./install.sh --with-lock` builds by cloning the running Omarchy's own
# lock plugin and splicing in install/lock-frame/*.qml. Omarchy has no tokens
# for any of these keys; Color.parseShell keeps keys it does not recognise, so
# they ride along in Color.shellValues and need no Omarchy change. Under an
# unpatched lock screen they are simply ignored, and under any other theme the
# patched one reverts to the stock lock with no restart.

# The Slate's bezel, drawn over the blurred wallpaper and under the passphrase
# field. Relative to the theme directory. Only a theme that sets this gets a
# frame, so the patched lock screen is a no-op under every other theme.
frame            = "assets/sheikah_frame.png"

# Fade the lock screen up out of the background colour when the session locks,
# and back down into it when it unlocks. Hyprland animates neither: there is no
# animation leaf for a session lock, and an ext-session-lock surface is not a
# layer surface, so no layer_rule can reach it. Without this key the lock
# appears and disappears on a single frame, which is what every other theme
# gets. Same channel as `frame` above -- Color.parseShell keeps keys it does
# not recognise, so this needs no Omarchy change.
#
# 140ms / OutCubic is the shell's house timing. The unlock half is capped at
# 1000ms in the QML, because that half is time the session stays locked after a
# correct password.
fade-duration    = 140

# The password mask. Omarchy masks with U+25CF, a plain bullet; this swaps it
# for the period of the theme's own font, which in Sheikah Complete is a rune,
# so the field fills with runes as you type.
#
# The font ships with the theme and is loaded straight from this directory at
# runtime -- nothing is installed on the machine and nothing is left behind
# when you switch away. If it fails to load for any reason the field falls
# back to the stock bullet, which matters: a period rendered in the ordinary
# UI font would be an almost invisible mask.
password-char       = "."
password-char-font  = "assets/sheikah-complete.ttf"

# Multiplies the mask's font size. The rune fills its whole em square where a
# bullet's ink is only about 42% of its box, so at 1.0 it reads very dense;
# 0.85 keeps it bold but leaves the field some air. Absent or 0 means 1.0.
password-char-scale = 0.85
